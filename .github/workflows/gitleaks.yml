name: gitleaks
# Flags secrets/keys checked into the repository (private keys, tokens,
# credentials, ...). Runs on every push to main and every PR, and scans the
# full history (fetch-depth: 0). Fails the check when a secret is found.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
