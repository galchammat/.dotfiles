set-option -sa terminal-overrides ",xterm*:Tc"

##### DEFAULT SHELL #####
# Use zsh for new windows/panes when LDAP prevents chsh from changing the
# login shell; if zsh is absent, keep tmux's default shell.
if-shell 'zsh_path=$(command -v zsh) && tmux set -g default-shell "$zsh_path" \; set -g default-command "$zsh_path"' ''

##### PREFIX #####
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### WINDOW INDEXING #####
set -g base-index 1
setw -g pane-base-index 1

##### BASIC NAVIGATION #####
bind n next-window
bind p previous-window
bind ] paste-buffer -p

##### QUALITY OF LIFE #####
set -g mouse on
set -g history-limit 100000

set -g mode-keys vi
set -g status-style "bg=colour235,fg=colour245"

set -g set-clipboard on
set -g allow-passthrough on

set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'

#### TAB LIST ALERTS #####
set-window-option -g monitor-bell on
