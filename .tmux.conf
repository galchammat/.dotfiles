set-option -sa terminal-overrides ",xterm*:Tc"

##### DEFAULT SHELL #####
# Use zsh for new windows/panes when LDAP prevents chsh from changing the
# login shell; if zsh is absent, keep tmux's default shell.
if-shell 'zsh_path=$(command -v zsh) && tmux set -g default-shell "$zsh_path" \; set -g default-command "$zsh_path"' ''

##### PREFIX #####
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### WINDOW INDEXING #####
set -g base-index 1
setw -g pane-base-index 1

##### BASIC NAVIGATION #####
bind n next-window
bind p previous-window
bind ] paste-buffer -p

##### QUALITY OF LIFE #####
set -g mouse on
set -g history-limit 100000

set -g mode-keys vi
set -g status-style "bg=colour235,fg=colour245"

set -g set-clipboard on
set -g allow-passthrough on

# Mouse drag-release and `y` copy the selection to the SYSTEM clipboard.
# OSC 52 (set-clipboard) is unreliable across terminals, so pipe explicitly:
# prefer wl-copy on Wayland, fall back to xclip on X. Portable across machines.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \
  "sh -c 'command -v wl-copy >/dev/null 2>&1 && wl-copy || xclip -selection clipboard -i'"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel \
  "sh -c 'command -v wl-copy >/dev/null 2>&1 && wl-copy || xclip -selection clipboard -i'"

# Window names track agent sessions:
# - Claude Code sets the pane title to "✳ <session name>"; its SessionStart /
#   SessionEnd hooks (~/.claude/hooks/tmux-window-name.sh) install a per-window
#   automatic-rename-format that strips the leading symbol token.
# - OpenCode sets the pane title to "OC | <session name>" (terminal.title) and
#   restores the previous title on exit, so the global format below recognizes
#   that prefix and renames the window live on any trigger — new session,
#   auto-naming, /rename, resume — clipped to 15 chars. Everything else (and
#   the OpenCode home screen / after exit) falls back to the running command.
# tmux re-evaluates this whenever the pane title changes; "OC |" is matched
# with [|] because a bare | is an operator inside #{?...} conditions.
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m:OC [|] *,#{pane_title}},#{?#{==:#{s/^OC [|] //:#{pane_title}},},#{pane_current_command},#{=15:#{s/^OC [|] //:#{pane_title}}}},#{pane_current_command}}'

#### TAB LIST ALERTS #####
set-window-option -g monitor-bell on
