# File dialogs in every portal-aware app (Slack, browsers, GIMP, ...) are
# handed to xdg-desktop-portal-termfilechooser, which runs yazi in a terminal
# instead of the toolkit's own chooser. Two things have to be in place or the
# apps silently fall back to their native dialog:
#   - the backend itself: xdg-desktop-portal-termfilechooser, installed by the
#     hypr ansible role from the seaweed COPR (no Fedora/Debian package);
#   - GTK_USE_PORTAL=1 in the session, or GTK/Electron apps never ask the
#     portal at all (see .config/hypr/hyprland.lua and .config/i3/config).
# After changing this file, restart the portal to pick it up:
#   systemctl --user restart xdg-desktop-portal
[preferred]
org.freedesktop.impl.portal.FileChooser=termfilechooser
