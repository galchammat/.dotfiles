---
# ~/.claude/settings.json stays out of this repo (see .gitignore): Claude Code
# writes machine-local settings into it as you use it. This role merges the keys
# below into that file and leaves every other key as it finds it.
claude_settings_path: "{{ ansible_facts['user_dir'] }}/.claude/settings.json"

claude_settings:
  # No "Co-Authored-By: Claude" trailer on commits, no "Generated with Claude
  # Code" line in pull requests, and no claude.ai session link on either. The
  # object form, not `attribution: false`, because older Claude Code versions
  # reject a boolean here and then ignore the whole settings file.
  attribution:
    commit: ""
    pr: ""
    sessionUrl: false

  # Sessions start in auto mode; the first time auto mode blocks something, the next tool call is one approval prompt,
  # and once approved the rest of that session runs without asking, as bypass mode would (files/elevate.sh). The
  # user, 2026-11-21: "if it hits one block, it should ask me ... should we go into bypass mode?" and never one prompt
  # after another.
  permissions:
    defaultMode: auto
  hooks:
    PermissionDenied:
      - matcher: "*"
        hooks: [{type: command, command: "~/.claude/hooks/elevate.sh denied", timeout: 10}]
    PreToolUse:
      - matcher: "*"
        hooks: [{type: command, command: "~/.claude/hooks/elevate.sh pre", timeout: 10}]
    PostToolUse:
      - matcher: "*"
        hooks: [{type: command, command: "~/.claude/hooks/elevate.sh ran", timeout: 10}]
