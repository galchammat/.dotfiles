- name: "Zsh | {{ ansible_facts['distribution'] }} | Check if zsh is already installed"
  ansible.builtin.command: which zsh
  register: zsh_check
  changed_when: false
  failed_when: false
  no_log: true

- name: "Zsh | {{ ansible_facts['distribution'] }} | Install zsh (system package)"
  ansible.builtin.package:
    name:
      - zsh
    state: present
  become: true
  when:
    - can_install_packages | default(false)
    - zsh_check.rc != 0
  register: zsh_system_install

- name: "Zsh | {{ ansible_facts['distribution'] }} | Alternative zsh installation (no sudo)"
  when:
    - not (can_install_packages | default(false))
    - zsh_check.rc != 0
  block:
    - name: "Zsh | Warning about missing zsh"
      ansible.builtin.debug:
        msg:
          - "⚠️  Zsh is not installed and sudo is not available."
          - ""
          - "To install zsh manually:"
          - "1. Ask your system administrator to install zsh"
          - "2. Or download from: https://github.com/zsh-users/zsh"
          - ""
          - "Some dotfiles features will not work without zsh."

- name: "Zsh | Check current shell"
  ansible.builtin.command: "echo $SHELL"
  register: current_shell
  changed_when: false

- name: "Zsh | Get zsh path"
  ansible.builtin.command: which zsh
  register: zsh_path
  changed_when: false
  failed_when: false
  when: zsh_check.rc == 0 or zsh_system_install is succeeded

- name: "Zsh | Check for passwordless sudo"
  ansible.builtin.command: sudo -n true
  register: sudo_check
  become: false
  changed_when: false
  failed_when: false
  when:
    - zsh_path.stdout is defined
    - zsh_path.stdout != ""
    - current_shell.stdout != zsh_path.stdout

- name: "Zsh | Set zsh as default shell (chsh)"
  ansible.builtin.command: "chsh -s {{ zsh_path.stdout }} {{ ansible_facts['user_id'] }}"
  become: true
  register: chsh_result
  # chsh only edits /etc/passwd entries. Accounts provided via systemd userdb /
  # sssd / LDAP ("can only change local entries") cannot be modified even as root;
  # that is an environment limitation, not a real failure. The exec hook below is
  # the portable fallback that always works.
  changed_when: chsh_result.rc == 0
  failed_when:
    - chsh_result.rc != 0
    - "'can only change local entries' not in (chsh_result.stderr | default(''))"
  when:
    - zsh_path.stdout is defined
    - zsh_path.stdout != ""
    - current_shell.stdout != zsh_path.stdout
    - can_install_packages | default(false)
    - sudo_check.rc | default(1) == 0

- name: "Zsh | Remove legacy inline handoff block from .bashrc"
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED: zsh handoff"
    state: absent
  # An earlier version of this role wrote an interactive bash->zsh exec hook
  # here. That approach was dropped in favour of chsh plus terminal-emulator
  # shell settings, so strip any leftover block from untracked ~/.bashrc.
  when: zsh_path.stdout is defined

- name: "Zsh | Remove any legacy handoff block from .bash_profile"
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.bash_profile"
    marker: "# {mark} ANSIBLE MANAGED: zsh handoff"
    state: absent
  # Older versions of this role also wrote the hook into .bash_profile; keep the
  # top-level tidy by removing it if present. Never creates the file.
  when: zsh_path.stdout is defined

- name: "Zsh | Note about default shell"
  ansible.builtin.debug:
    msg: >-
      {% if chsh_result is defined and chsh_result.changed | default(false) %}
      ✓ Login shell changed to zsh via chsh.
      {% elif chsh_result is defined and 'can only change local entries' in (chsh_result.stderr | default('')) %}
      ⚠️  This account is not a local /etc/passwd user (managed via systemd userdb /
      sssd / LDAP), so chsh cannot change the login shell. Terminal emulators use
      their own shell setting; on a bare TTY/SSH session run `exec zsh`.
      {% elif current_shell.stdout != zsh_path.stdout | default('') and not (can_install_packages | default(false) and sudo_check.rc | default(1) == 0) %}
      ⚠️  No passwordless sudo, so chsh was skipped. Terminal emulators use their
      own shell setting; on a bare TTY/SSH session run `exec zsh`.
      {% else %}
      ✓ zsh is already the login shell.
      {% endif %}

- name: "Zsh | Check if oh-my-zsh is already installed"
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh"
  register: ohmyzsh_stat

- name: "Zsh | Install oh-my-zsh"
  ansible.builtin.shell: |
    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended --keep-zshrc
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.oh-my-zsh"
  when:
    - not ohmyzsh_stat.stat.exists
    - zsh_check.rc == 0 or zsh_system_install is succeeded
  register: ohmyzsh_install

- name: "Zsh | Report installation status"
  ansible.builtin.debug:
    msg:
      - "Zsh installation status:"
      - "- Zsh installed: {{ '✓' if (zsh_check.rc == 0 or zsh_system_install is succeeded) else '✗' }}"
      - "- Zsh is default shell: {{ '✓' if (zsh_path.stdout is defined and current_shell.stdout == zsh_path.stdout) else '✗' }}"
      - "- Oh-My-Zsh installed: {{ '✓' if ohmyzsh_stat.stat.exists or ohmyzsh_install is succeeded else '✗' }}"
      - "- Sudo available: {{ '✓' if can_install_packages | default(false) else '✗' }}"
