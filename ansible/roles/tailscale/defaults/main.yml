---
# Trust the tailscale0 interface in firewalld so tailnet peers can reach sshd.
# On Fedora, firewalld rejects inbound on tailscale0 by default, which surfaces
# as "Connection refused" with no sshd log entry. Set to false on a host that
# should not be reachable over the tailnet.
trust_tailscale_ssh: true

# URL of the Tailscale dnf repo definition (Fedora/RHEL).
tailscale_fedora_repo_url: https://pkgs.tailscale.com/stable/fedora/tailscale.repo
