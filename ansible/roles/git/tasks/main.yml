- name: "Git | {{ ansible_facts['distribution'] }} | Check if git is already installed"
  ansible.builtin.command: which git
  register: git_check
  changed_when: false
  failed_when: false
  no_log: true

- name: "Git | {{ ansible_facts['distribution'] }} | Install git (system package)"
  ansible.builtin.package:
    name:
      - git
    state: present
  become: true
  when:
    - can_install_packages | default(false)
    - git_check.rc != 0
  register: git_system_install

- name: "Git | {{ ansible_facts['distribution'] }} | Alternative git installation (no sudo)"
  when:
    - not (can_install_packages | default(false))
    - git_check.rc != 0
  block:
    - name: "Git | Create ~/.local/bin directory"
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: '0755'

    - name: "Git | Download git from source (requires build tools)"
      ansible.builtin.debug:
        msg:
          - "⚠️  Git is not installed and sudo is not available."

          - ""

          - "To install git manually:"

          - "1. Download from: https://github.com/git/git/releases"

          - "2. Or use a portable git binary"

          - "3. Or ask your system administrator to install git"

          - ""

          - "Some dotfiles features will not work without git."

- name: "Git | {{ ansible_facts['distribution'] }} | Report installation status"
  ansible.builtin.debug:
    msg:
      - "Git installation status:"
      - "- Already installed: {{ '✓' if git_check.rc == 0 else '✗' }}"
      - "- System install attempted: {{ '✓' if git_system_install is defined and git_system_install is succeeded else 'N/A' }}"
      - "- Sudo available: {{ '✓' if can_install_packages | default(false) else '✗' }}"
      - "when: git_check.rc != 0"

- name: Install community.general collection
  command: ansible-galaxy collection install community.general
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.ansible/collections/ansible_collections/community/general"
  delegate_to: localhost
  run_once: true

- name: "Git | Ensure the machine-local config directory exists"
  # git_config with scope: file will not create missing parent directories.
  ansible.builtin.file:
    path: "{{ git_local_config | dirname }}"
    state: directory
    mode: '0755'

- name: "Git | Set color.ui"
  community.general.git_config:
    name: color.ui
    scope: file
    file: "{{ git_local_config }}"
    value: auto

- name: "Git | Set diff.colorMoved"
  community.general.git_config:
    name: diff.colorMoved
    scope: file
    file: "{{ git_local_config }}"
    value: zebra

- name: "Git | Set fetch.prune"
  community.general.git_config:
    name: fetch.prune
    scope: file
    file: "{{ git_local_config }}"
    value: true

# Fetch over HTTPS, push over SSH: see the [url] section in .gitconfig.
#
# The commented-out attempt that used to live here set plain `insteadOf`, which
# rewrites fetch URLs as well. That breaks cloning on a machine whose key is not
# yet on GitHub, which is the failure this repo hit. `pushInsteadOf` rewrites
# only the push URL and is set declaratively in .gitconfig instead.

- name: "Git | Set init.defaultBranch"
  community.general.git_config:
    name: init.defaultBranch
    scope: file
    file: "{{ git_local_config }}"
    value: main

- name: "Git | Set rerere.enabled"
  community.general.git_config:
    name: rerere.enabled
    scope: file
    file: "{{ git_local_config }}"
    value: true

- name: "Git | Set pull.ff"
  community.general.git_config:
    name: pull.ff
    scope: file
    file: "{{ git_local_config }}"
    value: only

- name: "Git | Set pull.rebase"
  community.general.git_config:
    name: pull.rebase
    scope: file
    file: "{{ git_local_config }}"
    value: true

- name: "Git | Set rebase.autoStash"
  community.general.git_config:
    name: rebase.autoStash
    scope: file
    file: "{{ git_local_config }}"
    value: true

- name: "Git | Set user.email"
  community.general.git_config:
    name: user.email
    scope: file
    file: "{{ git_local_config }}"
    value: "{{ git_user_email }}"

- name: "Git | Set user.name"
  community.general.git_config:
    name: user.name
    scope: file
    file: "{{ git_local_config }}"
    value: "{{ git_user_name }}"

- name: "Git | Set user.signingkey"
  community.general.git_config:
    name: user.signingkey
    scope: file
    file: "{{ git_local_config }}"
    value: "{{ ansible_facts['user_dir'] }}/.ssh/id_ed25519.pub"

- name: "Git | Set gpg.format"
  community.general.git_config:
    name: gpg.format
    scope: file
    file: "{{ git_local_config }}"
    value: ssh

- name: "Git | Set commit.gpgsign"
  community.general.git_config:
    name: commit.gpgsign
    scope: file
    file: "{{ git_local_config }}"
    value: true

- name: "Git | Set tag.gpgsign"
  community.general.git_config:
    name: tag.gpgsign
    scope: file
    file: "{{ git_local_config }}"
    value: true

# === SSH KEY & GITHUB SETUP ===
# The ed25519 key itself is generated by the `ssh` role, which runs earlier so
# the identity exists even if a later role fails. This section only wires that
# key into GitHub (auth + signing).
- name: "Git | Get machine ID for unique identification"
  ansible.builtin.slurp:
    src: /etc/machine-id
  register: machine_id_content

- name: "Git | Set machine ID fact"
  ansible.builtin.set_fact:
    machine_id_short: "{{ (machine_id_content.content | b64decode | trim)[:8] }}"

- name: "Git | Check that the SSH key exists"
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.ssh/id_ed25519.pub"
  register: ssh_private_key_stat

- name: "Git | Check if GitHub CLI (gh) is installed"
  ansible.builtin.command: which gh
  register: gh_check
  changed_when: false
  failed_when: false
  no_log: true

- name: "Git | Install GitHub CLI if missing"
  ansible.builtin.package:
    name: gh
    state: present
  become: true
  when:
    - gh_check.rc != 0
    - can_install_packages | default(false)

- name: "Git | Warning when gh not available"
  ansible.builtin.debug:
    msg:
      - "⚠️  GitHub CLI (gh) is not installed and cannot be installed."
      - ""
      - "To enable GitHub integration:"
      - "1. Install gh manually or run the packages role"
      - "2. Then run: gh auth login --git-protocol ssh --web"
  when:
    - gh_check.rc != 0
    - not (can_install_packages | default(false))

- name: "Git | Check if GitHub CLI is authenticated"
  ansible.builtin.command: gh auth status
  register: gh_auth_status
  changed_when: false
  failed_when: false
  no_log: true
  when: gh_check.rc == 0

# `gh auth login --web` prints a one-time code and blocks until the user
# approves it in a browser. Running it here stalls the playbook on any headless
# or unattended run, which is exactly what ansible/CLAUDE.md says not to do. It
# is deferred to the finish-setup commands printed at the end of bin/dotfiles.

- name: "Git | Register SSH key on GitHub (authentication + signing)"
  # Same key, both purposes: an SSH key must be added once per type on GitHub.
  # gh needs the admin:public_key and admin:ssh_signing_key token scopes; when
  # they are missing (or the key already exists) this is a no-op, never a hard
  # failure — the finish-setup commands cover the human follow-up.
  ansible.builtin.command: >
    gh ssh-key add "{{ ansible_facts['user_dir'] }}/.ssh/id_ed25519.pub"
    --type {{ item }}
    --title "{{ ansible_facts['hostname'] }}-{{ machine_id_short }}"
  loop:
    - authentication
    - signing
  when:
    - gh_check.rc == 0
    - gh_auth_status.rc | default(1) == 0
    - ssh_private_key_stat.stat.exists
    - not ansible_check_mode
  register: gh_ssh_upload
  changed_when: gh_ssh_upload.rc == 0
  failed_when: false

- name: "Git | Collect the setup steps that still need a human"
  ansible.builtin.set_fact:
    git_manual_steps: >-
      {{ [] if (gh_check.rc == 0 and gh_auth_status.rc | default(1) == 0)
         else ['gh auth login --git-protocol ssh --web',
               'gh auth refresh -h github.com -s admin:public_key,admin:ssh_signing_key',
               'gh ssh-key add ~/.ssh/id_ed25519.pub --type authentication --title "'
               ~ ansible_facts['hostname'] ~ '-' ~ machine_id_short ~ '"',
               'gh ssh-key add ~/.ssh/id_ed25519.pub --type signing --title "'
               ~ ansible_facts['hostname'] ~ '-' ~ machine_id_short ~ '"'] }}

# bin/dotfiles prints this after the playbook finishes, so the remaining steps
# are the last thing on screen rather than scrolled off in the ansible output.
- name: "Git | Record the finish-setup commands"
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.dotfiles-next-steps"
    mode: '0644'
    content: |
      {% for step in git_manual_steps %}
      {{ step }}
      {% endfor %}
  when:
    - not ansible_check_mode
    - git_manual_steps | length > 0

- name: "Git | Clear stale finish-setup commands when nothing is pending"
  # copy rejects empty content, and bin/dotfiles only prints this file when it is
  # non-empty (-s), so removing it is the clean "all done" state.
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.dotfiles-next-steps"
    state: absent
  when:
    - not ansible_check_mode
    - git_manual_steps | length == 0

- name: "Git | GitHub setup status"
  ansible.builtin.debug:
    msg:
      - "GitHub setup:"
      - "- SSH key: {{ ansible_facts['user_dir'] }}/.ssh/id_ed25519.pub"
      - "- Authenticated: {{ '✓' if (gh_check.rc == 0 and gh_auth_status.rc | default(1) == 0) else '✗ (see finish-setup commands)' }}"
      - "- Steps still needed: {{ git_manual_steps | length }}"

- name: "Git | Ensure ~/.config/git/allowed_signers exists"
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/git"
    state: directory
    mode: "0755"

- name: "Git | Check if SSH key exists"
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.ssh/id_ed25519.pub"
  register: ssh_key_stat

- name: "Git | Read SSH public key"
  ansible.builtin.slurp:
    src: "{{ ansible_facts['user_dir'] }}/.ssh/id_ed25519.pub"
  register: ssh_pubkey_slurp
  when: ssh_key_stat.stat.exists

- name: "Git | Set SSH public key fact"
  ansible.builtin.set_fact:
    ssh_pubkey_content: "{{ ssh_pubkey_slurp.content | b64decode | trim }}"
  when: ssh_key_stat.stat.exists

- name: "Git | Configure allowed_signers with local SSH key"
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.config/git/allowed_signers"
    block: "{{ git_user_email }} {{ ssh_pubkey_content }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - {{ ansible_facts['hostname'] }}"
    mode: "0600"
    create: true
  when: ssh_key_stat.stat.exists

- name: "Git | Warning when SSH key not found"
  ansible.builtin.debug:
    msg:
      - "⚠️  SSH key not found at ~/.ssh/id_ed25519.pub"
      - ""
      - "Git commit signing is enabled but no SSH key exists."
      - "Generate one with: ssh-keygen -t ed25519 -C '{{ git_user_email }}'"
      - ""
      - "Then run this playbook again to configure allowed_signers."
  when: not ssh_key_stat.stat.exists

- name: "Git | Set gpg.ssh.allowedSignersFile"
  community.general.git_config:
    name: gpg.ssh.allowedSignersFile
    scope: file
    file: "{{ git_local_config }}"
    value: "{{ ansible_facts['user_dir'] }}/.config/git/allowed_signers"

