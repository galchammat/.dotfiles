---
# Machine-generated git settings (identity, signing key) are written here rather
# than to ~/.gitconfig, which is tracked in this repo. Writing to the tracked
# file leaves the work tree permanently dirty, which in turn makes the
# `git pull` at the start of every dotfiles run fail. ~/.gitconfig includes
# this file, so the settings still apply.
git_local_config: "{{ ansible_facts['user_dir'] }}/.config/git/config.local"
