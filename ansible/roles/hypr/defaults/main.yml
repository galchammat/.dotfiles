---
# Hyprland's Lua configuration support is recent, and the user's tracked
# .config/hypr/hyprland.lua depends on it. Fedora's base repositories can lag
# behind Hyprland releases, so this role enables these COPRs, each only when it
# publishes a matching Fedora chroot for this release/arch:
#   - sdegler/hyprland: the full Hyprland stack (compositor + hypr* helpers),
#     built for current Fedora releases (F43/44/45). Replaces solopasha/hyprland,
#     which now publishes Rawhide only and therefore 404s on stable Fedora.
#   - lihaohong/yazi: yazi, which is not packaged in base Fedora or sdegler.
hypr_fedora_coprs:
  - sdegler/hyprland
  - lihaohong/yazi

# Fedora package candidates for the tools directly referenced by
# .config/hypr/*.conf and .config/hypr/hyprland.lua. The role probes dnf and
# installs available packages, then reports any gaps. wl-clipboard is
# intentionally omitted because the packages role already installs it on Fedora.
hypr_fedora_candidate_packages:
  # Core compositor and Hyprland helpers
  - hyprland
  - hypridle
  - hyprpaper
  - hyprsunset
  - hyprlock
  - hyprpolkitagent
  - xdg-desktop-portal-hyprland

  # Apps and desktop daemons launched by the config
  - kitty
  - firefox
  - yazi
  - rofi
  - mako
  - gnome-keyring

  # Keybinding and media utilities
  - grim
  - slurp
  - brightnessctl
  - playerctl
  - wireplumber
  - pipewire
  - pipewire-pulseaudio
  - procps-ng

# Debian/Ubuntu Hyprland packaging varies by release. The role probes these
# candidates with apt-cache and installs only packages available in the enabled
# apt repositories, then reports anything missing instead of failing the run.
# wl-clipboard, pipewire, pipewire-pulse, and wireplumber are intentionally
# omitted because the packages role already installs them on Debian/Ubuntu.
hypr_debian_candidate_packages:
  # Core compositor and Hyprland helpers
  - hyprland
  - hypridle
  - hyprpaper
  - hyprsunset
  - hyprlock
  - hyprpolkitagent
  - xdg-desktop-portal-hyprland

  # Apps and desktop daemons launched by the config
  - kitty
  - firefox
  - yazi
  - rofi
  - mako-notifier
  - gnome-keyring

  # Keybinding and media utilities
  - grim
  - slurp
  - brightnessctl
  - playerctl
  - procps

# Commands the tracked Hyprland configs execute directly or require at runtime.
# wl-copy and wpctl are checked here but installed by the packages role where it
# already covers them.
hypr_required_commands:
  - Hyprland
  - hyprctl
  - hypridle
  - hyprpaper
  - hyprsunset
  - hyprlock
  - hyprpolkitagent
  - kitty
  - firefox
  - yazi
  - rofi
  - mako
  - gnome-keyring-daemon
  - grim
  - slurp
  - wl-copy
  - brightnessctl
  - playerctl
  - wpctl
  - loginctl
  - pidof
