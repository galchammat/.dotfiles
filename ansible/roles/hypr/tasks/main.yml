---
- name: "Hypr | Fedora | Ensure COPR support is installed"
  ansible.builtin.dnf:
    name:
      - dnf-plugins-core
    state: present
  become: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - can_install_packages | default(false)
    - not ansible_check_mode

- name: "Hypr | Fedora | Check Hyprland COPR metadata"
  ansible.builtin.uri:
    url: "https://copr.fedorainfracloud.org/api_3/project?ownername={{ item.split('/')[0] }}&projectname={{ item.split('/')[1] }}"
    return_content: true
  loop: "{{ hypr_fedora_coprs }}"
  register: hypr_fedora_copr_metadata
  changed_when: false
  failed_when: false
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - can_install_packages | default(false)
    - not ansible_check_mode

- name: "Hypr | Fedora | Decide which COPRs support this release"
  ansible.builtin.set_fact:
    hypr_fedora_copr_chroot: "fedora-{{ ansible_facts['distribution_major_version'] }}-{{ ansible_facts['architecture'] }}"
    hypr_fedora_available_coprs: >-
      {{ hypr_fedora_copr_metadata.results | default([])
         | selectattr('status', 'defined')
         | selectattr('status', 'eq', 200)
         | selectattr('json.chroot_repos', 'defined')
         | selectattr('json.chroot_repos', 'contains',
                      'fedora-' ~ ansible_facts['distribution_major_version'] ~ '-' ~ ansible_facts['architecture'])
         | map(attribute='item') | list }}
  when: ansible_facts['os_family'] == 'RedHat'

# sdegler/hyprland tracks the current Hyprland ecosystem for Fedora when base
# repositories lag; lihaohong/yazi supplies yazi. Each COPR is enabled only when
# it publishes a chroot for this release/arch, so an unsupported future release
# simply skips it (and the assertion below then flags the missing session).
- name: "Hypr | Fedora | Enable Hyprland COPRs"
  community.general.copr:
    name: "{{ item }}"
    state: enabled
  become: true
  loop: "{{ hypr_fedora_available_coprs | default([]) }}"
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - can_install_packages | default(false)
    - not ansible_check_mode

- name: "Hypr | Fedora | Check available Hyprland packages"
  ansible.builtin.command: "dnf -q repoquery --available --latest-limit=1 {{ item }}"
  loop: "{{ hypr_fedora_candidate_packages }}"
  register: hypr_fedora_package_checks
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['os_family'] == 'RedHat'

- name: "Hypr | Fedora | Collect available Hyprland packages"
  ansible.builtin.set_fact:
    hypr_fedora_available_packages: >-
      {{ hypr_fedora_package_checks.results
         | default([])
         | selectattr('rc', 'eq', 0)
         | selectattr('stdout', 'ne', '')
         | map(attribute='item')
         | list }}
    hypr_fedora_missing_packages: >-
      {{ hypr_fedora_package_checks.results
         | default([])
         | rejectattr('stdout', 'ne', '')
         | map(attribute='item')
         | list }}
  when: ansible_facts['os_family'] == 'RedHat'

- name: "Hypr | Fedora | Install available Hyprland packages"
  ansible.builtin.dnf:
    name: "{{ hypr_fedora_available_packages }}"
    state: present
  become: true
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - can_install_packages | default(false)
    - not ansible_check_mode
    - hypr_fedora_available_packages | default([]) | length > 0

- name: "Hypr | Debian | Update package cache"
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - can_install_packages | default(false)
    - not ansible_check_mode

- name: "Hypr | Debian | Check available Hyprland packages"
  ansible.builtin.command: "apt-cache show {{ item }}"
  loop: "{{ hypr_debian_candidate_packages }}"
  register: hypr_debian_package_checks
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts['os_family'] == 'Debian'

- name: "Hypr | Debian | Collect available Hyprland packages"
  ansible.builtin.set_fact:
    hypr_debian_available_packages: >-
      {{ hypr_debian_package_checks.results
         | default([])
         | selectattr('rc', 'eq', 0)
         | map(attribute='item')
         | list }}
    hypr_debian_missing_packages: >-
      {{ hypr_debian_package_checks.results
         | default([])
         | rejectattr('rc', 'eq', 0)
         | map(attribute='item')
         | list }}
  when: ansible_facts['os_family'] == 'Debian'

- name: "Hypr | Debian | Install available Hyprland packages"
  ansible.builtin.apt:
    name: "{{ hypr_debian_available_packages }}"
    state: present
  become: true
  when:
    - ansible_facts['os_family'] == 'Debian'
    - can_install_packages | default(false)
    - not ansible_check_mode
    - hypr_debian_available_packages | default([]) | length > 0

- name: "Hypr | Check referenced commands"
  ansible.builtin.command: "which {{ item }}"
  loop: "{{ hypr_required_commands }}"
  register: hypr_command_checks
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: "Hypr | Check if Wayland sessions directory exists"
  ansible.builtin.stat:
    path: /usr/share/wayland-sessions
  register: hypr_wayland_sessions_dir

- name: "Hypr | Check if Hyprland session file exists"
  ansible.builtin.stat:
    path: /usr/share/wayland-sessions/hyprland.desktop
  register: hypr_desktop_file
  when: hypr_wayland_sessions_dir.stat.exists

- name: "Hypr | Report installation status"
  ansible.builtin.debug:
    msg:
      - "Hyprland desktop status:"
      - "- Fedora COPR: {{ (hypr_fedora_available_coprs | default([]) | join(', ') ~ ' enabled for ' ~ hypr_fedora_copr_chroot) if (ansible_facts['os_family'] == 'RedHat' and (hypr_fedora_available_coprs | default([]) | length > 0)) else ('none available for ' ~ hypr_fedora_copr_chroot | default('this release')) if ansible_facts['os_family'] == 'RedHat' else 'not used on this distro' }}"
      - "- Fedora packages available: {{ hypr_fedora_available_packages | default([]) | join(', ') if ansible_facts['os_family'] == 'RedHat' else 'n/a' }}"
      - "- Fedora packages missing/skipped: {{ hypr_fedora_missing_packages | default([]) | join(', ') if ansible_facts['os_family'] == 'RedHat' else 'n/a' }}"
      - "- Debian packages available: {{ hypr_debian_available_packages | default([]) | join(', ') if ansible_facts['os_family'] == 'Debian' else 'n/a' }}"
      - "- Debian packages missing/skipped: {{ hypr_debian_missing_packages | default([]) | join(', ') if ansible_facts['os_family'] == 'Debian' else 'n/a' }}"
      - "- Referenced commands missing: {{ (hypr_command_checks.results | rejectattr('rc', 'eq', 0) | map(attribute='item') | list | join(', ')) | default('none', true) }}"
      - "- Wayland sessions available: {{ '✓' if (hypr_wayland_sessions_dir.stat.exists | default(false)) else '✗' }}"
      - "- Hyprland.desktop found: {{ '✓' if (hypr_desktop_file.stat.exists | default(false)) else '✗' }}"
      - "- Lua config note: .config/hypr/hyprland.lua requires a recent Hyprland build with Lua config support."
      - ""
      - "{{ 'Note: Log out and select Hyprland from the display manager to use this session.' if (hypr_desktop_file.stat.exists | default(false)) else 'Note: Install packages first, then select Hyprland from the display manager.' }}"

# Fail loudly instead of silently no-op'ing. The role used to skip missing
# packages and only *print* a status line, so a broken COPR left Hyprland
# uninstalled while ansible and molecule both stayed green (no failure -> no
# Discord alert). Assert the session file actually exists whenever we were able
# to install packages, so a regression fails the play and CI.
- name: "Hypr | Assert the Hyprland session is actually installed"
  ansible.builtin.assert:
    that:
      - hypr_desktop_file.stat.exists | default(false)
    fail_msg: >-
      Hyprland is not installed: /usr/share/wayland-sessions/hyprland.desktop is
      missing, so it will not appear in the display manager. The COPR probably
      lacks a chroot for {{ hypr_fedora_copr_chroot | default('this release') }}
      (available: {{ hypr_fedora_available_coprs | default([]) | join(', ') | default('none', true) }}).
    success_msg: "Hyprland session present; it will appear in the display manager."
  when:
    - can_install_packages | default(false)
    - not ansible_check_mode
    - ansible_facts['os_family'] in ['RedHat', 'Debian']
