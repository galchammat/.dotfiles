---
# Generates the user's ed25519 identity key early in the play so it exists
# before any later role (or a failing role) can block it. Downstream roles
# (e.g. git) only consume this key: signing config, GitHub upload, allowed_signers.

- name: "SSH | Ensure ~/.ssh exists with correct permissions"
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.ssh"
    state: directory
    mode: "0700"

- name: "SSH | Check if ed25519 key exists"
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.ssh/id_ed25519"
  register: ssh_private_key_stat

- name: "SSH | Generate ed25519 key"
  # -N '' generates without a passphrase so the run stays unattended. Add one
  # later if wanted:  ssh-keygen -p -f ~/.ssh/id_ed25519
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - "{{ git_user_email }}"
      - -f
      - "{{ ansible_facts['user_dir'] }}/.ssh/id_ed25519"
  when:
    - not ssh_private_key_stat.stat.exists
    - not ansible_check_mode
  register: ssh_key_generated

- name: "SSH | Display new public key"
  ansible.builtin.debug:
    msg:
      - "✓ SSH key generated at ~/.ssh/id_ed25519"
      - "Public key:"
      - "{{ lookup('file', ansible_facts['user_dir'] + '/.ssh/id_ed25519.pub') }}"
  when: ssh_key_generated is changed

- name: "SSH | Configure SSH for GitHub"
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.ssh/config"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - GitHub"
    block: |
      Host github.com
        HostName github.com
        User git
        IdentityFile ~/.ssh/id_ed25519
        AddKeysToAgent yes
    create: true
    mode: "0600"

# The interactive `github` role is held out of the full run (its `never` tag),
# so the full playbook can never register the key by itself. Surface a next-step
# telling the user to run it, but only while the key is not yet on the account.
# The runner (bin/dotfiles) prints ~/.dotfiles-next-steps at the very end.
- name: "SSH | Read the local public key body"
  ansible.builtin.set_fact:
    ssh_pubkey_body: "{{ lookup('file', ansible_facts['user_dir'] + '/.ssh/id_ed25519.pub').split(' ')[1] }}"
  when: not ansible_check_mode

- name: "SSH | Check whether the key is already registered on GitHub"
  # Non-interactive probe. If gh is missing or not logged in this fails, which
  # we treat as "not registered" so the setup hint is shown. Never prompts.
  ansible.builtin.command: gh ssh-key list
  register: gh_key_list
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: "SSH | Advise running 'dotfiles --git' until the key is registered"
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.dotfiles-next-steps"
    line: "dotfiles --git"
    create: true
    mode: "0644"
    state: "{{ 'absent' if ssh_pubkey_body in (gh_key_list.stdout | default('')) else 'present' }}"
  when: not ansible_check_mode

# --- Remote access: allow tailnet SSH through firewalld ---------------------
# firewalld rejects inbound on tailscale0 by default (Connection refused, no
# sshd log). Trusting the interface lets tailnet peers reach sshd. Gated on the
# interface existing and firewalld running, so it is a no-op in CI and on hosts
# without Tailscale. Idempotent via the --query-interface guard below.
- name: "SSH | Check for the tailscale0 interface"
  ansible.builtin.stat:
    path: /sys/class/net/tailscale0
  register: tailscale_iface

- name: "SSH | Check whether firewalld is active"
  ansible.builtin.command: systemctl is-active firewalld
  register: firewalld_active
  changed_when: false
  failed_when: false
  when:
    - trust_tailscale_ssh | bool
    - tailscale_iface.stat.exists

- name: "SSH | Check whether tailscale0 is already trusted"
  ansible.builtin.command: firewall-cmd --permanent --zone=trusted --query-interface=tailscale0
  register: ts_trusted
  changed_when: false
  failed_when: false
  become: true
  when:
    - trust_tailscale_ssh | bool
    - tailscale_iface.stat.exists
    - firewalld_active.stdout | default('') == 'active'

- name: "SSH | Trust tailscale0 in the firewalld trusted zone"
  ansible.builtin.command: firewall-cmd --permanent --zone=trusted --add-interface=tailscale0
  become: true
  register: ts_trust_added
  when:
    - trust_tailscale_ssh | bool
    - tailscale_iface.stat.exists
    - firewalld_active.stdout | default('') == 'active'
    - ts_trusted.rc | default(1) != 0

- name: "SSH | Reload firewalld to apply the trusted interface"
  ansible.builtin.command: firewall-cmd --reload
  become: true
  changed_when: true
  when: ts_trust_added is defined and ts_trust_added is changed
