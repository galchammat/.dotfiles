---
# COMMON PACKAGES (distro-agnostic names that work on both apt and dnf)
- name: "Packages | Update package cache (Debian/Ubuntu)"
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: "Packages | Install common packages"
  ansible.builtin.package:
    name:
      # Terminal & Shell
      - tmux
      - zsh

      # Development Tools
      - cmake
      - curl
      - gettext
      - git
      - gh
      - ninja-build
      - sqlite3
      - unzip

      # CLI Utilities
      - ripgrep

      # Security & Privacy
      - gnupg2
      - openssh-server
    state: present
  become: yes

# DEBIAN/UBUNTU-SPECIFIC PACKAGES
- name: "Packages | Install Debian-specific packages"
  ansible.builtin.apt:
    name:
      # Package Managers
      - flatpak

      # Window Manager & Desktop
      - autorandr
      - dbus-x11
      - dmenu
      - feh
      - i3
      - picom

      # Terminal
      - alacritty

      # Development
      - build-essential
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
      - just

      # Audio
      - pavucontrol
      - pipewire
      - pipewire-pulse
      - wireplumber
      - libspa-0.2-bluetooth

      # Clipboard
      - wl-clipboard
      - xclip

      # Security
      - rng-tools

      # System Tools
      - netdata

      # Passwords
      - pass
    state: present
  become: yes
  when: ansible_facts['os_family'] == 'Debian'

# FEDORA-SPECIFIC PACKAGES
- name: "Packages | Install Fedora-specific packages"
  ansible.builtin.dnf:
    name:
      # Development
      - gcc
      - gcc-c++
      - make
      - gtk3-devel
      - webkit2gtk4.1-devel
      - just

      # Terminal
      - alacritty

      # CLI Utilities
      - pass

      # Clipboard
      - wl-clipboard
      - xclip
    state: present
  become: yes
  when: ansible_facts['os_family'] == 'RedHat'

# FLATPAK SETUP
- name: "Packages | Add Flathub repository"
  flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
  become: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: "Packages | Install Discord via Flatpak"
  flatpak:
    name: com.discordapp.Discord
    state: present
    remote: flathub
    method: system
  become: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: "Packages | Install Flameshot via Flatpak"
  flatpak:
    name: org.flameshot.Flameshot
    state: present
    remote: flathub
    method: system
  become: yes
  when: ansible_facts['os_family'] == 'Debian'

# BUILD NEOVIM FROM SOURCE
- name: "Packages | Check if Neovim is already installed"
  ansible.builtin.command: which nvim
  register: nvim_check
  changed_when: false
  failed_when: false
  no_log: true

- name: "Packages | Install Neovim build dependencies (Debian)"
  ansible.builtin.apt:
    name:
      - ninja-build
      - gettext
      - cmake
      - unzip
      - curl
      - build-essential
    state: present
  become: yes
  when:
    - nvim_check.rc != 0
    - ansible_facts['os_family'] == 'Debian'

- name: "Packages | Install Neovim build dependencies (Fedora)"
  ansible.builtin.dnf:
    name:
      - ninja-build
      - gettext
      - cmake
      - unzip
      - curl
      - gcc
      - gcc-c++
      - make
    state: present
  become: yes
  when:
    - nvim_check.rc != 0
    - ansible_facts['os_family'] == 'RedHat'

- name: "Packages | Clone Neovim repository"
  git:
    repo: 'https://github.com/neovim/neovim.git'
    dest: '/tmp/neovim'
    version: stable
    depth: 1
  when:
    - nvim_check.rc != 0
    - not ansible_check_mode

- name: "Packages | Build Neovim"
  shell: |
    cd /tmp/neovim
    make CMAKE_BUILD_TYPE=RelWithDebInfo
  args:
    creates: /tmp/neovim/build/bin/nvim
  when:
    - nvim_check.rc != 0
    - not ansible_check_mode

- name: "Packages | Install Neovim"
  shell: |
    cd /tmp/neovim
    make install
  become: yes
  args:
    creates: /usr/local/bin/nvim
  when:
    - nvim_check.rc != 0
    - not ansible_check_mode

- name: "Packages | Clean up Neovim source"
  file:
    path: /tmp/neovim
    state: absent
  when: not ansible_check_mode

# INSTALL OPENCODE
- name: "Packages | Check if OpenCode is already installed"
  ansible.builtin.command: which opencode
  register: opencode_check
  changed_when: false
  failed_when: false
  no_log: true

- name: "Packages | Install OpenCode globally via npm"
  ansible.builtin.shell: |
    source {{ ansible_facts['user_dir'] }}/.nvm/nvm.sh
    npm install -g opencode-ai
  args:
    executable: /bin/bash
  when:
    - opencode_check.rc != 0
    - not ansible_check_mode
