---
# COMMON PACKAGES (distro-agnostic names that work on both apt and dnf)
- name: "Packages | Update package cache (Debian/Ubuntu)"
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: "Packages | Install common packages"
  ansible.builtin.package:
    name:
      # Terminal & Shell
      - tmux
      - zsh

      # Development Tools
      - curl
      - git
      - gh
      - sqlite3
      - stow
      - unzip

      # CLI Utilities
      - ripgrep

      # Security & Privacy
      - gnupg2
      - openssh-server
    state: present
  become: yes

# DEBIAN/UBUNTU-SPECIFIC PACKAGES
- name: "Packages | Install Debian-specific packages"
  ansible.builtin.apt:
    name:
      # Package Managers
      - flatpak

      # Window Manager & Desktop
      - autorandr
      - dbus-x11
      - dmenu
      - feh
      - i3
      - picom

      # Terminal
      - alacritty

      # Development
      - build-essential
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
      - just

      # Audio
      - pavucontrol
      - pipewire
      - pipewire-pulse
      - wireplumber
      - libspa-0.2-bluetooth

      # Clipboard
      - wl-clipboard
      - xclip

      # Security
      - rng-tools

      # System Tools
      - netdata

      # Passwords
      - pass
    state: present
  become: yes
  when: ansible_facts['os_family'] == 'Debian'

# FEDORA-SPECIFIC PACKAGES
- name: "Packages | Install Fedora-specific packages"
  ansible.builtin.dnf:
    name:
      # Development
      - gcc
      - gcc-c++
      - make
      - gtk3-devel
      - webkit2gtk4.1-devel
      - just

      # Terminal
      - alacritty

      # CLI Utilities
      - pass

      # Clipboard
      - wl-clipboard
      - xclip
    state: present
  become: yes
  when: ansible_facts['os_family'] == 'RedHat'

# FLATPAK SETUP
- name: "Packages | Add Flathub repository"
  flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://flathub.org/repo/flathub.flatpakrepo
  become: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: "Packages | Install Discord via Flatpak"
  flatpak:
    name: com.discordapp.Discord
    state: present
    remote: flathub
    method: system
  become: yes
  when: ansible_facts['os_family'] == 'Debian'

- name: "Packages | Install Flameshot via Flatpak"
  flatpak:
    name: org.flameshot.Flameshot
    state: present
    remote: flathub
    method: system
  become: yes
  when: ansible_facts['os_family'] == 'Debian'

# INSTALL NEOVIM (official prebuilt release)
# Building from source took 10-20 minutes and needed a full toolchain. The
# published tarball is ~11MB and extracts in seconds.
- name: "Packages | Check the installed Neovim version"
  ansible.builtin.command: "{{ neovim_prefix }}/bin/nvim --version"
  register: nvim_version_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: "Packages | Decide whether Neovim needs installing"
  ansible.builtin.set_fact:
    # `nvim --version` starts with e.g. "NVIM v0.12.5". Compared exactly rather
    # than by regex, since the version string contains dots.
    neovim_needs_install: >-
      {{ nvim_version_check.rc != 0
         or (nvim_version_check.stdout_lines | first | default('') | trim)
            != ('NVIM ' ~ neovim_version) }}

- name: "Packages | Create the Neovim prefix"
  ansible.builtin.file:
    path: "{{ neovim_prefix }}"
    state: directory
    mode: '0755'
  become: true
  when:
    - neovim_needs_install
    - not ansible_check_mode

- name: "Packages | Install Neovim {{ neovim_version }} from the official release"
  ansible.builtin.unarchive:
    src: "https://github.com/neovim/neovim/releases/download/{{ neovim_version }}/{{ neovim_asset }}.tar.gz"
    dest: "{{ neovim_prefix }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: root
    group: root
  become: true
  when:
    - neovim_needs_install
    - not ansible_check_mode

# nvim resolves its runtime files relative to the real path of the binary, so
# linking it onto PATH from the prefix keeps share/nvim discoverable. force is
# needed to replace a binary left behind by the old source build.
- name: "Packages | Link Neovim onto PATH"
  ansible.builtin.file:
    src: "{{ neovim_prefix }}/bin/nvim"
    dest: /usr/local/bin/nvim
    state: link
    force: true
  become: true

- name: "Packages | Report the Neovim install"
  ansible.builtin.debug:
    msg:
      - "Neovim {{ neovim_version }} ({{ neovim_asset }})"
      - "- Prefix: {{ neovim_prefix }}"
      - "- Was already current: {{ 'no' if neovim_needs_install else 'yes' }}"

# INSTALL OPENCODE
- name: "Packages | Check if OpenCode is already installed"
  ansible.builtin.command: which opencode
  register: opencode_check
  changed_when: false
  failed_when: false
  no_log: true

- name: "Packages | Install OpenCode globally via npm"
  ansible.builtin.shell: |
    source {{ ansible_facts['user_dir'] }}/.nvm/nvm.sh
    npm install -g opencode-ai
  args:
    executable: /bin/bash
  when:
    - opencode_check.rc != 0
    - not ansible_check_mode
