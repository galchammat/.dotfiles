---
# Runs the power role the way bin/dotfiles does, on a Fedora container that
# boots systemd, so the lock is really taken from logind and read back. As on
# CSB, the hostname (`workstation`) is not in power_hold_hosts: a stand-in
# `tailscale` gives the machine name `csb`, and the role must match on that.
# The default scenario (hostname `dotfiles`) checks that other machines skip it.
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: power
    hostname: workstation
    image: quay.io/fedora/fedora:44
    dockerfile: Dockerfile.j2
    pre_build_image: false
    command: /usr/sbin/init
    systemd: always
provisioner:
  name: ansible
  config_options:
    defaults:
      result_format: yaml
      interpreter_python: auto_silent
verifier:
  name: ansible
scenario:
  # Idempotence is checked inside converge.yml (a second run must change
  # nothing), because molecule's own step would re-run the shipping tasks.
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
