---
- name: Ship the working tree into the machine
  hosts: localhost
  gather_facts: false
  vars:
    project: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    tarball: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/dotfiles.tar.gz"
  tasks:
    - name: Archive the repository
      ansible.builtin.command:
        cmd: >-
          tar --exclude=./.git --exclude=./.venv --exclude=./molecule
          --exclude=./.copilot --exclude=./.claude -czf {{ tarball }} -C {{ project }} .
      changed_when: true

- name: Run the caffeine role as bin/dotfiles would, twice
  hosts: all
  gather_facts: false
  vars:
    ansible_user: tester
    tarball: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/dotfiles.tar.gz"
    dest: /home/tester/dotfiles
  tasks:
    - name: Create the destination directory
      ansible.builtin.file:
        path: "{{ dest }}"
        state: directory
        mode: '0755'

    - name: Unpack the working tree
      ansible.builtin.unarchive:
        src: "{{ tarball }}"
        dest: "{{ dest }}"

    - name: Run the playbook for the caffeine role
      ansible.builtin.command:
        cmd: ansible-playbook playbook.yml --tags caffeine
        chdir: "{{ dest }}/ansible"
      register: first_run
      changed_when: true
      failed_when: false

    - name: Show the first run
      ansible.builtin.debug:
        msg: "{{ first_run.stdout_lines[-40:] + first_run.stderr_lines[-20:] }}"

    - name: The first run must succeed
      ansible.builtin.assert:
        that: first_run.rc == 0
        fail_msg: "ansible-playbook exited {{ first_run.rc }}."

    - name: Run it again
      ansible.builtin.command:
        cmd: ansible-playbook playbook.yml --tags caffeine
        chdir: "{{ dest }}/ansible"
      register: second_run
      changed_when: false
      failed_when: false

    - name: Show the second run
      ansible.builtin.debug:
        msg: "{{ second_run.stdout_lines[-25:] + second_run.stderr_lines[-20:] }}"

    - name: The second run must succeed and change nothing
      ansible.builtin.assert:
        that:
          - second_run.rc == 0
          - second_run.stdout is search('changed=0')
        fail_msg: "A second dotfiles run changed something or failed (rc {{ second_run.rc }})."
