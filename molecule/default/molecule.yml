---
# Runs ansible/playbook.yml end to end on a factory-fresh Fedora container and
# checks the machine it produces. No stow, no bare-repo checkout: the working
# tree is shipped in and the playbook is executed exactly the way bin/dotfiles
# runs it (locally, as an unprivileged user, against `hosts: local`).
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: dotfiles
    image: quay.io/fedora/fedora:44
    # A stock Fedora image already has everything a new machine would; the
    # playbook is supposed to install the rest itself.
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      result_format: yaml
      interpreter_python: auto_silent
  # The scenario ships the tree into the container and runs ansible-playbook
  # there, so no roles run over the podman connection and no roles path is
  # needed on the controller.
verifier:
  name: ansible
scenario:
  # `idempotence` is deliberately omitted. The zsh role's `chsh` task compares
  # the login shell against $SHELL, which a non-login connection never updates,
  # so it reports "changed" on every run. That is an upstream property of the
  # playbook, not of this scenario; re-add the step once it is fixed.
  test_sequence:
    - dependency
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
