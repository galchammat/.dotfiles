---
- name: Ship the working tree into the machine
  hosts: localhost
  gather_facts: false
  vars:
    project: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
    tarball: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/dotfiles.tar.gz"
  tasks:
    # The local checkout is shipped rather than cloned so uncommitted changes to
    # the roles are tested before they are pushed. .git/.venv/molecule are
    # dropped: the playbook never reads them and they only bloat the transfer.
    - name: Archive the repository
      ansible.builtin.command:
        cmd: >-
          tar --exclude=./.git --exclude=./.venv --exclude=./molecule
          --exclude=./.copilot -czf {{ tarball }} -C {{ project }} .
      changed_when: true

- name: Run the full playbook end to end as an unprivileged user
  hosts: all
  gather_facts: true
  vars:
    ansible_user: tester
    tarball: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/dotfiles.tar.gz"
    dest: /home/tester/dotfiles
  tasks:
    - name: Create the destination directory
      ansible.builtin.file:
        path: "{{ dest }}"
        state: directory
        owner: tester
        group: tester
        mode: '0755'

    - name: Unpack the working tree
      ansible.builtin.unarchive:
        src: "{{ tarball }}"
        dest: "{{ dest }}"
        owner: tester
        group: tester

    # Exactly how bin/dotfiles invokes it: from the ansible/ directory so the
    # repo's ansible.cfg (inventory, roles_path) is picked up, targeting the
    # local `hosts: local` group. The github role stays out via its `never` tag.
    - name: Run the full playbook
      ansible.builtin.command:
        cmd: ansible-playbook playbook.yml
        chdir: "{{ dest }}/ansible"
      environment:
        ANSIBLE_FORCE_COLOR: "1"
      register: install_run
      changed_when: true
      failed_when: false
      timeout: 3000

    - name: Show the tail of the playbook output
      ansible.builtin.debug:
        msg: "{{ (install_run.stdout_lines | default([]))[-40:] }}"

    - name: Show stderr if the run failed
      ansible.builtin.debug:
        msg: "{{ (install_run.stderr_lines | default([]))[-40:] }}"
      when: install_run.rc != 0

    - name: The playbook must complete without error
      ansible.builtin.assert:
        that: install_run.rc == 0
        fail_msg: "ansible-playbook exited {{ install_run.rc }}."
        success_msg: "The full playbook completed."
