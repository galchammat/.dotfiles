---
- name: Verify the machine the playbook produced
  hosts: all
  gather_facts: true
  vars:
    ansible_user: tester
    home: "{{ ansible_facts['user_dir'] }}"
  tasks:
    - name: Load the pinned neovim version the packages role uses
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/ansible/roles/packages/defaults/main.yml"

    # --- the tools every later step depends on are installed -----------------
    - name: Check each required command resolves
      ansible.builtin.command:
        cmd: sh -c 'command -v {{ item }}'
      register: cmd_check
      changed_when: false
      failed_when: false
      loop: [nvim, tmux, zsh, git, gh, rg, unzip, curl, alacritty, just, pass, yazi]

    - name: Assert every required command is installed
      ansible.builtin.assert:
        that: item.rc == 0
        fail_msg: "'{{ item.item }}' is missing after a full install."
      loop: "{{ cmd_check.results }}"
      loop_control:
        label: "{{ item.item }}"

    # --- neovim is the pinned prebuilt release, linked onto PATH -------------
    - name: Read the installed neovim version
      ansible.builtin.command: nvim --version
      register: nvim_ver
      changed_when: false

    - name: Assert neovim is the pinned version
      ansible.builtin.assert:
        that: "'NVIM ' ~ neovim_version == (nvim_ver.stdout_lines | first | trim)"
        fail_msg: >-
          Expected NVIM {{ neovim_version }}, got
          '{{ nvim_ver.stdout_lines | first | trim }}'.

    # --- nvm is installed and wired into bash --------------------------------
    - name: Stat the nvm entry point
      ansible.builtin.stat:
        path: "{{ home }}/.nvm/nvm.sh"
      register: nvm_sh

    - name: Assert nvm is installed
      ansible.builtin.assert:
        that: nvm_sh.stat.exists
        fail_msg: "~/.nvm/nvm.sh is missing, so nvm did not install."

    - name: Read .bashrc
      ansible.builtin.slurp:
        src: "{{ home }}/.bashrc"
      register: bashrc

    - name: Assert the nvm block was added to .bashrc
      ansible.builtin.assert:
        that: (bashrc.content | b64decode) is search('ANSIBLE MANAGED BLOCK - NVM')
        fail_msg: "The nvm block was not written into ~/.bashrc."

    # --- oh-my-zsh installed without clobbering the shell config ------------
    - name: Stat the oh-my-zsh directory
      ansible.builtin.stat:
        path: "{{ home }}/.oh-my-zsh"
      register: omz

    - name: Assert oh-my-zsh is installed
      ansible.builtin.assert:
        that: omz.stat.exists
        fail_msg: "~/.oh-my-zsh is missing, so oh-my-zsh did not install."

    # --- the ssh identity exists for signing / auth --------------------------
    - name: Stat the ed25519 key pair
      ansible.builtin.stat:
        path: "{{ home }}/{{ item }}"
      register: sshkey
      loop:
        - .ssh/id_ed25519
        - .ssh/id_ed25519.pub

    - name: Assert both halves of the key exist
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: "~/{{ item.item }} was not generated."
      loop: "{{ sshkey.results }}"
      loop_control:
        label: "{{ item.item }}"

    # --- git signing is configured in the machine-local file, not ~/.gitconfig
    - name: Read the machine-local git config
      ansible.builtin.slurp:
        src: "{{ home }}/.config/git/config.local"
      register: git_local

    - name: Assert commit signing is wired to the ssh key
      ansible.builtin.assert:
        that:
          - (git_local.content | b64decode) is search('gpgsign = [Tt]rue')
          - (git_local.content | b64decode) is search('format = ssh')
          - (git_local.content | b64decode) is search('id_ed25519.pub')
        fail_msg: >-
          ~/.config/git/config.local does not configure SSH commit signing.

    # The identity must land in config.local, never in the tracked ~/.gitconfig,
    # or the working tree is left dirty and the next `git pull` autostashes.
    - name: Read the tracked git config if the playbook checked it out
      ansible.builtin.stat:
        path: "{{ home }}/.gitconfig"
      register: tracked_gitconfig

    - name: Assert identity did not leak into a tracked ~/.gitconfig
      ansible.builtin.command:
        cmd: git config --file {{ home }}/.gitconfig --get user.signingkey
      register: leaked_key
      changed_when: false
      failed_when: false
      when: tracked_gitconfig.stat.exists

    - name: Fail if the signing key was written to ~/.gitconfig
      ansible.builtin.assert:
        that: leaked_key.stdout | default('') | length == 0
        fail_msg: "user.signingkey leaked into the tracked ~/.gitconfig."
      when: tracked_gitconfig.stat.exists

    # --- Claude Code leaves no attribution on commits or pull requests -------
    - name: Read the Claude Code user settings
      ansible.builtin.slurp:
        src: "{{ home }}/.claude/settings.json"
      register: claude_settings

    - name: Assert commit and PR attribution are switched off
      ansible.builtin.assert:
        that:
          - (claude_settings.content | b64decode | from_json).attribution.commit == ''
          - (claude_settings.content | b64decode | from_json).attribution.pr == ''
          - not (claude_settings.content | b64decode | from_json).attribution.sessionUrl
        fail_msg: "~/.claude/settings.json does not switch off Claude Code attribution."

    # --- file dialogs open yazi, not the toolkit's own chooser --------------
    # Three separate pieces have to line up, and when any one is missing the
    # apps just fall back to their native dialog without an error, so check all
    # of them: the portal backend (package), the wrapper it runs, and the two
    # tracked config files that point FileChooser at it.
    - name: Stat the FileChooser portal backend
      ansible.builtin.stat:
        path: "{{ item }}"
      register: filechooser_backend
      loop:
        - /usr/share/xdg-desktop-portal/portals/termfilechooser.portal
        - /usr/libexec/xdg-desktop-portal-termfilechooser
        - /usr/share/xdg-desktop-portal-termfilechooser/yazi-wrapper.sh

    - name: Assert the FileChooser backend is installed
      ansible.builtin.assert:
        that: item.stat.exists
        fail_msg: >-
          '{{ item.item }}' is missing, so apps open their own file dialog
          instead of yazi.
      loop: "{{ filechooser_backend.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert the yazi wrapper is runnable
      ansible.builtin.command:
        cmd: test -x /usr/share/xdg-desktop-portal-termfilechooser/yazi-wrapper.sh
      changed_when: false

    - name: Read the tracked portal wiring
      ansible.builtin.slurp:
        src: "{{ home }}/dotfiles/{{ item }}"
      register: portal_wiring
      loop:
        - .config/xdg-desktop-portal/portals.conf
        - .config/xdg-desktop-portal-termfilechooser/config
        - .config/hypr/hyprland.lua

    - name: Assert FileChooser is routed to termfilechooser
      ansible.builtin.assert:
        that: (portal_wiring.results[0].content | b64decode) is search('org.freedesktop.impl.portal.FileChooser=termfilechooser')
        fail_msg: "portals.conf does not route FileChooser to termfilechooser."

    - name: Assert the tracked config names the wrapper the package ships
      ansible.builtin.assert:
        that: (portal_wiring.results[1].content | b64decode) is search('cmd=yazi-wrapper.sh')
        fail_msg: "xdg-desktop-portal-termfilechooser/config does not set cmd=yazi-wrapper.sh."

    # Without this the environment never reaches Slack and friends, and the
    # portal is bypassed no matter how well the backend is installed.
    - name: Assert the Hyprland config exports GTK_USE_PORTAL
      ansible.builtin.assert:
        that: (portal_wiring.results[2].content | b64decode) is search('GTK_USE_PORTAL')
        fail_msg: "hyprland.lua does not export GTK_USE_PORTAL, so apps never use the portal."

    # --- only the machines in caffeine_hosts are kept awake -------------------
    # This container is `dotfiles`, not in the list (the caffeine scenario runs
    # the role on a `csb`), so the role must leave it alone.
    - name: Stat the keep-awake service
      ansible.builtin.stat:
        path: /etc/systemd/system/caffeine.service
      register: caffeine_unit

    - name: Assert a machine outside caffeine_hosts is not kept awake
      ansible.builtin.assert:
        that: not caffeine_unit.stat.exists
        fail_msg: "caffeine.service was installed on a machine not in caffeine_hosts."
